---
layout: default
---
<style>
  .post-head { padding: 58px 0 6px; }
  .post-head .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .post-head .cat { font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 6px; }
  .post-head .date, .post-head .rt { font-family: var(--mono); font-size: 12.5px; color: var(--faint); }
  .post-head h1 { font-size: clamp(1.85rem, 5vw, 2.5rem); font-weight: 820; margin: 0;
    line-height: 1.22; letter-spacing: -0.035em; }

  .toc { margin: 30px 0 8px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); overflow: hidden; }
  .toc > summary { cursor: pointer; list-style: none; padding: 14px 18px; font-weight: 700;
    font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .toc > summary::-webkit-details-marker { display: none; }
  .toc > summary::before { content: "▸"; color: var(--accent); transition: transform .15s ease; }
  .toc[open] > summary::before { transform: rotate(90deg); }
  .toc .mono { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-left: auto; }
  .toc ol { margin: 0; padding: 4px 18px 16px 38px; counter-reset: toc; list-style: none; }
  .toc li { margin: 7px 0; counter-increment: toc; position: relative; }
  .toc li::before { content: counter(toc); position: absolute; left: -24px;
    font-family: var(--mono); font-size: 11px; color: var(--faint); top: 2px; }
  .toc a { color: var(--ink-2); text-decoration: none; font-size: 14.5px; }
  .toc a:hover { color: var(--accent); }

  .post-body { padding-top: 10px; }
  .post-body > h1:first-child { display: none; }
  .post-nav a { font-family: var(--mono); font-size: 13.5px; text-decoration: none; }
  .post-nav a:hover { text-decoration: underline; }
</style>

<article>
  <header class="post-head">
    <div class="wrap">
      <div class="meta">
        {% if page.categories.size > 0 %}<span class="cat">{{ page.categories | first }}</span>{% endif %}
        <time class="date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y년 %m월 %d일' }}</time>
        <span class="rt" id="readtime"></span>
      </div>
      <h1>{{ page.title }}</h1>
      <details class="toc" id="toc" open>
        <summary>목차 <span class="mono">contents</span></summary>
        <ol id="toc-list"></ol>
      </details>
    </div>
  </header>

  <div class="wrap post-body" id="post-body">
    {{ content }}
    <hr>
    <nav class="post-nav"><a href="{{ '/' | relative_url }}">← 글 목록으로</a></nav>
  </div>
</article>

<script>
  (function () {
    var body = document.getElementById('post-body');
    // reading time (Korean ~ 450 chars/min)
    var chars = (body.textContent || '').replace(/\s/g, '').length;
    var min = Math.max(1, Math.round(chars / 450));
    document.getElementById('readtime').textContent = '약 ' + min + '분 읽기';
    // auto TOC from h2
    var list = document.getElementById('toc-list');
    var hs = body.querySelectorAll('h2');
    if (hs.length < 2) { document.getElementById('toc').style.display = 'none'; return; }
    hs.forEach(function (h, i) {
      if (!h.id) h.id = 'sec-' + i;
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/^[§\s]+/, '').trim();
      li.appendChild(a); list.appendChild(li);
    });
  })();
</script>
