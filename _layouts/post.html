---
layout: default
---
<style>
  .post-head { padding: 54px 0 4px; }
  .post-head .meta { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    font-size: 13.5px; color: var(--muted); }
  .post-head .cat { color: var(--accent); font-weight: 700; }
  .post-head .sep { color: var(--line-2); }
  .post-head h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800; margin: 0;
    line-height: 1.24; letter-spacing: -0.03em; }

  .toc { margin: 32px 0 6px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); overflow: hidden; }
  .toc > summary { cursor: pointer; list-style: none; padding: 13px 16px; font-weight: 700;
    font-size: 14px; color: var(--ink-2); }
  .toc > summary::-webkit-details-marker { display: none; }
  .toc > summary::before { content: "＋"; color: var(--accent); margin-right: 8px; font-weight: 700; }
  .toc[open] > summary::before { content: "－"; }
  .toc ol { margin: 0; padding: 2px 18px 14px 20px; counter-reset: toc; list-style: none; }
  .toc li { margin: 6px 0; counter-increment: toc; }
  .toc li::before { content: counter(toc) ". "; color: var(--faint); font-variant-numeric: tabular-nums; }
  .toc a { color: var(--ink-2); text-decoration: none; font-size: 14px; }
  .toc a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  .post-body { padding-top: 12px; }
  .post-body > h1:first-child { display: none; }
  .post-nav a { font-size: 14.5px; text-decoration: none; }
  .post-nav a:hover { text-decoration: underline; text-underline-offset: 2px; }
</style>

<article>
  <header class="post-head">
    <div class="wrap">
      <div class="meta">
        {% if page.categories.size > 0 %}<span class="cat">{{ page.categories | first }}</span><span class="sep">·</span>{% endif %}
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y년 %m월 %d일' }}</time>
        <span class="sep">·</span><span id="readtime"></span>
      </div>
      <h1>{{ page.title }}</h1>
      <details class="toc" id="toc" open>
        <summary>목차</summary>
        <ol id="toc-list"></ol>
      </details>
    </div>
  </header>

  <div class="wrap post-body" id="post-body">
    {{ content }}
    <hr>
    <nav class="post-nav"><a href="{{ '/' | relative_url }}">← 글 목록으로 돌아가기</a></nav>
  </div>
</article>

<script>
  (function () {
    var body = document.getElementById('post-body');
    var chars = (body.textContent || '').replace(/\s/g, '').length;
    var min = Math.max(1, Math.round(chars / 450));
    document.getElementById('readtime').textContent = '약 ' + min + '분 읽기';
    var list = document.getElementById('toc-list');
    var hs = body.querySelectorAll('h2');
    if (hs.length < 2) { document.getElementById('toc').style.display = 'none'; return; }
    hs.forEach(function (h, i) {
      if (!h.id) h.id = 'sec-' + i;
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.trim();
      li.appendChild(a); list.appendChild(li);
    });
  })();
</script>
