<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #fbfbfd; --surface: #ffffff; --surface-2: #f4f5f8;
      --ink: #15171c; --ink-2: #3c4250; --muted: #6b7280; --faint: #9aa1ab;
      --line: #e7e9ee; --line-2: #dfe2e9;
      --accent: #4b3fe4; --accent-2: #7b6cff; --accent-soft: #efeefe;
      --code-bg: #f6f7f9;
      --sel: #ddd9ff;
      /* syntax (light) */
      --c-com:#8a919e; --c-key:#8b3fd6; --c-typ:#1d4ed8; --c-str:#15803d;
      --c-num:#c2410c; --c-fn:#1d4ed8; --c-op:#0e7490; --c-pre:#8b3fd6; --c-pun:#5b616e;
      --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
      --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0c0e14; --surface:#141822; --surface-2:#171c27;
        --ink:#e9ecf3; --ink-2:#c3c9d6; --muted:#98a0b0; --faint:#69717f;
        --line:#232838; --line-2:#2c3346;
        --accent:#8f85ff; --accent-2:#a99cff; --accent-soft:#1c1b33;
        --code-bg:#12161f; --sel:#2d2a55;
        --c-com:#6b7483; --c-key:#c792ea; --c-typ:#82aaff; --c-str:#c3e88d;
        --c-num:#f78c6c; --c-fn:#82aaff; --c-op:#89ddff; --c-pre:#c792ea; --c-pun:#9aa3b5;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    ::selection { background: var(--sel); }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); font-size: 17px; line-height: 1.8;
      letter-spacing: -0.011em; word-break: keep-all; overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .wrap { width: 100%; max-width: 724px; margin: 0 auto; padding: 0 20px; }

    /* progress bar */
    #progress { position: fixed; top: 0; left: 0; height: 2.5px; width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2)); z-index: 60; transition: width .1s linear; }

    /* top bar */
    .topbar { position: sticky; top: 0; z-index: 40;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid var(--line); }
    .topbar .wrap { display: flex; align-items: center; height: 60px; }
    .topbar .brand { display: flex; align-items: center; gap: 9px; font-weight: 750;
      font-size: 15.5px; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; }
    .topbar .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
    .topbar .spacer { flex: 1; }
    .topbar .nav { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-decoration: none; }
    .topbar .nav:hover { color: var(--accent); }

    main { padding-bottom: 100px; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2.5px; }
    a:hover { color: var(--accent-2); }

    h1,h2,h3,h4 { letter-spacing: -0.028em; line-height: 1.3; font-weight: 750; scroll-margin-top: 78px; }
    h1 { font-size: 2.05rem; margin: 1.4em 0 .5em; font-weight: 820; }
    h2 { font-size: 1.5rem; margin: 2.4em 0 .8em; padding-top: 1.1em; border-top: 1px solid var(--line);
      display: flex; align-items: baseline; gap: .5em; }
    h2::before { content: "§"; color: var(--accent); font-weight: 700; font-size: .8em; }
    article > h2:first-of-type { border-top: none; padding-top: .3em; }
    h3 { font-size: 1.18rem; margin: 2em 0 .6em; color: var(--ink); }
    p { margin: 1.1em 0; color: var(--ink-2); }
    strong { font-weight: 700; color: var(--ink); }
    ul, ol { padding-left: 1.35em; color: var(--ink-2); }
    li { margin: .38em 0; }
    li::marker { color: var(--faint); }

    /* inline + block code */
    code { font-family: var(--mono); font-size: .85em; background: var(--surface-2);
      padding: .13em .42em; border-radius: 5px; color: var(--ink); border: 1px solid var(--line); }
    pre, div.highlight, figure.highlight { margin: 1.5em 0; }
    div.highlighter-rouge, figure.highlight, div.highlight { background: var(--code-bg);
      border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 18px; overflow-x: auto; line-height: 1.65; margin: 1.5em 0; }
    div.highlight pre, figure.highlight pre { border: none; border-radius: 0; margin: 0; }
    pre code { background: none; padding: 0; border: none; font-size: .82em; color: var(--ink); }

    /* syntax tokens (rouge) */
    .highlight .c, .highlight .cm, .highlight .c1, .highlight .cs { color: var(--c-com); font-style: italic; }
    .highlight .cp { color: var(--c-pre); }
    .highlight .k, .highlight .kc, .highlight .kd, .highlight .kn, .highlight .kp, .highlight .kr { color: var(--c-key); }
    .highlight .kt { color: var(--c-typ); }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .se, .highlight .sb, .highlight .sc, .highlight .sd, .highlight .sh, .highlight .si, .highlight .sx, .highlight .sr { color: var(--c-str); }
    .highlight .m, .highlight .mi, .highlight .mf, .highlight .mh, .highlight .mo, .highlight .il { color: var(--c-num); }
    .highlight .nf, .highlight .fm { color: var(--c-fn); }
    .highlight .nb, .highlight .bp { color: var(--c-op); }
    .highlight .nc, .highlight .nn, .highlight .no { color: var(--c-typ); }
    .highlight .nt { color: var(--c-key); }
    .highlight .na { color: var(--c-num); }
    .highlight .o, .highlight .ow { color: var(--c-op); }
    .highlight .p, .highlight .pi { color: var(--c-pun); }
    .highlight .err { color: inherit; }

    /* tables */
    article table { display: block; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin: 1.6em 0; font-size: .95em; }
    th, td { border-bottom: 1px solid var(--line); padding: 11px 15px; text-align: left; vertical-align: top; }
    thead th { border-bottom: 2px solid var(--accent); font-weight: 700; white-space: nowrap; color: var(--ink); }
    tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }

    /* blockquote / callout */
    blockquote { margin: 1.5em 0; padding: .7em 1.15em;
      border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent-soft) 60%, transparent);
      border-radius: 0 10px 10px 0; color: var(--ink-2); }
    blockquote p { margin: .35em 0; color: var(--ink-2); }
    blockquote strong { color: var(--ink); }

    hr { border: none; border-top: 1px solid var(--line); margin: 2.6em 0; }
    img { max-width: 100%; border-radius: 10px; }
    .mermaid { text-align: center; margin: 1.9em 0; }

    .site-foot { border-top: 1px solid var(--line); }
    .site-foot .wrap { padding: 28px 20px 48px; color: var(--faint); font-size: 13px; font-family: var(--mono); }
    .site-foot a { color: var(--muted); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto; } }
    @media (max-width: 520px) {
      body { font-size: 16px; } h1 { font-size: 1.68rem; } h2 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div id="progress"></div>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>한목의 개발 블로그</a>
      <span class="spacer"></span>
      <a class="nav" href="https://github.com/shm3041" rel="me">github ↗</a>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-foot">
    <div class="wrap">한목 · {{ site.time | date: '%Y' }} · <a href="https://github.com/shm3041/shm3041.github.io">source</a></div>
  </footer>

  <script>
    // reading progress
    (function () {
      var bar = document.getElementById('progress');
      function upd() {
        var h = document.documentElement;
        var sc = h.scrollTop || document.body.scrollTop;
        var max = (h.scrollHeight - h.clientHeight) || 1;
        bar.style.width = Math.min(100, (sc / max) * 100) + '%';
      }
      document.addEventListener('scroll', upd, { passive: true });
      window.addEventListener('resize', upd); upd();
    })();
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('[class*="language-mermaid"]').forEach(function (node) {
      var codeEl = node.matches('code') ? node : (node.querySelector('code') || node);
      var text = codeEl.textContent;
      var container = node.closest('div.language-mermaid, div.highlighter-rouge, figure.highlight, pre') || node;
      var div = document.createElement('div');
      div.className = 'mermaid'; div.textContent = text;
      container.replaceWith(div);
    });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral',
      fontFamily: '"Pretendard Variable", Pretendard, sans-serif' });
    try { await mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
  </script>
</body>
</html>
