<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg:#ffffff; --surface:#faf9f6; --surface-2:#f1f0ec;
      --ink:#1a1917; --ink-2:#34343a; --muted:#6c6d73; --faint:#9b9ca2;
      --line:#eae8e2; --line-2:#dedcd4;
      --accent:#17724f; --accent-2:#0f5a3d; --accent-soft:#e8f1eb;
      --code-bg:#f7f6f2; --sel:#cfe6d9;
      /* syntax (light) */
      --c-com:#8a8f88; --c-key:#9a3b86; --c-typ:#1f5fb0; --c-str:#2f7d3f;
      --c-num:#b5531c; --c-fn:#1f5fb0; --c-op:#107a73; --c-pre:#9a3b86; --c-pun:#5a5e63;
      --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
      --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0e100f; --surface:#151816; --surface-2:#1a1e1b;
        --ink:#e8eae5; --ink-2:#c4c7c1; --muted:#969b94; --faint:#6a6f69;
        --line:#23271f; --line-2:#2c3129;
        --accent:#4fb088; --accent-2:#6bc5a1; --accent-soft:#16241d;
        --code-bg:#121512; --sel:#204034;
        --c-com:#6f756d; --c-key:#d19ac8; --c-typ:#84b0e8; --c-str:#9fd49a;
        --c-num:#e0996b; --c-fn:#84b0e8; --c-op:#73c9bd; --c-pre:#d19ac8; --c-pun:#9aa09a;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    ::selection { background: var(--sel); }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); font-size: 17px; line-height: 1.82;
      letter-spacing: -0.009em; word-break: keep-all; overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 24px; }

    /* top bar */
    .topbar { border-bottom: 1px solid var(--line); background: var(--bg); }
    .topbar .wrap { display: flex; align-items: center; height: 64px; }
    .topbar .brand { font-weight: 800; font-size: 16px; color: var(--ink);
      text-decoration: none; letter-spacing: -0.02em; }
    .topbar .spacer { flex: 1; }
    .topbar .nav { font-size: 14px; color: var(--muted); text-decoration: none; }
    .topbar .nav:hover { color: var(--accent); }

    main { padding-bottom: 96px; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2.5px; }
    a:hover { color: var(--accent-2); }

    h1,h2,h3,h4 { letter-spacing: -0.024em; line-height: 1.32; font-weight: 800; scroll-margin-top: 84px; }
    h1 { font-size: 2rem; margin: 1.3em 0 .5em; }
    h2 { font-size: 1.42rem; margin: 2.3em 0 .7em; }
    h3 { font-size: 1.16rem; margin: 1.9em 0 .55em; color: var(--ink); }
    p { margin: 1.05em 0; color: var(--ink-2); }
    strong { font-weight: 700; color: var(--ink); }
    ul, ol { padding-left: 1.3em; color: var(--ink-2); }
    li { margin: .36em 0; }
    li::marker { color: var(--faint); }

    /* inline + block code */
    code { font-family: var(--mono); font-size: .85em; background: var(--surface-2);
      padding: .12em .4em; border-radius: 5px; color: var(--ink); }
    pre, div.highlight, figure.highlight { margin: 1.5em 0; }
    div.highlighter-rouge, figure.highlight, div.highlight { background: var(--code-bg);
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px 18px; overflow-x: auto; line-height: 1.66; margin: 1.5em 0; }
    div.highlight pre, figure.highlight pre { border: none; border-radius: 0; margin: 0; }
    pre code { background: none; padding: 0; font-size: .82em; color: var(--ink); }

    /* syntax tokens (rouge) */
    .highlight .c, .highlight .cm, .highlight .c1, .highlight .cs { color: var(--c-com); font-style: italic; }
    .highlight .cp { color: var(--c-pre); }
    .highlight .k, .highlight .kc, .highlight .kd, .highlight .kn, .highlight .kp, .highlight .kr { color: var(--c-key); }
    .highlight .kt { color: var(--c-typ); }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .se, .highlight .sb, .highlight .sc, .highlight .sd, .highlight .sh, .highlight .si, .highlight .sx, .highlight .sr { color: var(--c-str); }
    .highlight .m, .highlight .mi, .highlight .mf, .highlight .mh, .highlight .mo, .highlight .il { color: var(--c-num); }
    .highlight .nf, .highlight .fm { color: var(--c-fn); }
    .highlight .nb, .highlight .bp { color: var(--c-op); }
    .highlight .nc, .highlight .nn, .highlight .no { color: var(--c-typ); }
    .highlight .nt { color: var(--c-key); }
    .highlight .na { color: var(--c-num); }
    .highlight .o, .highlight .ow { color: var(--c-op); }
    .highlight .p, .highlight .pi { color: var(--c-pun); }
    .highlight .err { color: inherit; }

    /* tables */
    article table { display: block; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin: 1.6em 0; font-size: .95em; }
    th, td { border-bottom: 1px solid var(--line); padding: 11px 14px; text-align: left; vertical-align: top; }
    thead th { border-bottom: 1.5px solid var(--ink-2); font-weight: 700; white-space: nowrap; color: var(--ink); }

    /* blockquote */
    blockquote { margin: 1.5em 0; padding: .2em 0 .2em 1.1em;
      border-left: 2px solid var(--accent); color: var(--muted); }
    blockquote p { margin: .4em 0; color: var(--muted); }
    blockquote strong { color: var(--ink-2); }

    hr { border: none; border-top: 1px solid var(--line); margin: 2.6em 0; }
    img { max-width: 100%; border-radius: 8px; }
    .mermaid { text-align: center; margin: 1.9em 0; }

    .site-foot { border-top: 1px solid var(--line); }
    .site-foot .wrap { padding: 26px 24px 46px; color: var(--muted); font-size: 14px; }
    .site-foot a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    .site-foot a:hover { color: var(--accent); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto; } }
    @media (max-width: 520px) {
      body { font-size: 16px; } .wrap { padding: 0 18px; }
      h1 { font-size: 1.64rem; } h2 { font-size: 1.26rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">한목의 개발 블로그</a>
      <span class="spacer"></span>
      <a class="nav" href="https://github.com/shm3041" rel="me">GitHub</a>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-foot">
    <div class="wrap">한목이 {{ site.time | date: '%Y' }}년에 쓰고 정리합니다. <a href="https://github.com/shm3041/shm3041.github.io">소스 보기</a></div>
  </footer>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('[class*="language-mermaid"]').forEach(function (node) {
      var codeEl = node.matches('code') ? node : (node.querySelector('code') || node);
      var text = codeEl.textContent;
      var container = node.closest('div.language-mermaid, div.highlighter-rouge, figure.highlight, pre') || node;
      var div = document.createElement('div');
      div.className = 'mermaid'; div.textContent = text;
      container.replaceWith(div);
    });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral',
      fontFamily: '"Pretendard Variable", Pretendard, sans-serif' });
    try { await mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
  </script>
</body>
</html>
