<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #1b1f24;
      --muted: #6b7280;
      --faint: #9aa1ab;
      --line: #e4e7ec;
      --accent: #4b3fe4;
      --accent-soft: #eceaffe0;
      --code-bg: #f2f3f6;
      --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1016;
        --surface: #161922;
        --ink: #e8eaf0;
        --muted: #9aa2b1;
        --faint: #6b7483;
        --line: #262b36;
        --accent: #9a90ff;
        --accent-soft: #211f3a;
        --code-bg: #1a1e28;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); font-size: 17px; line-height: 1.78;
      font-weight: 400; letter-spacing: -0.01em;
      word-break: keep-all; overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px; }

    /* ── Top bar ── */
    .topbar { position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(140%) blur(10px);
      border-bottom: 1px solid var(--line); }
    .topbar .wrap { display: flex; align-items: center; gap: 12px; height: 58px; }
    .topbar .brand { display: flex; align-items: center; gap: 9px;
      font-weight: 700; font-size: 15.5px; color: var(--ink); text-decoration: none;
      letter-spacing: -0.02em; }
    .topbar .brand .dot { width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
    .topbar .spacer { flex: 1; }
    .topbar .nav { font-family: var(--mono); font-size: 13px; color: var(--muted);
      text-decoration: none; }
    .topbar .nav:hover { color: var(--accent); }

    main { padding-bottom: 96px; }

    /* ── Links & type ── */
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    h1, h2, h3, h4 { letter-spacing: -0.025em; line-height: 1.32; font-weight: 700; }
    h1 { font-size: 2.05rem; margin: 1.4em 0 0.5em; font-weight: 800; }
    h2 { font-size: 1.42rem; margin: 2.2em 0 0.7em; padding-top: 0.2em; }
    h3 { font-size: 1.15rem; margin: 1.8em 0 0.5em; }
    p { margin: 1.05em 0; }
    strong { font-weight: 700; }

    article h2 { border-top: 1px solid var(--line); padding-top: 1.1em; }
    article > h2:first-of-type { border-top: none; }

    /* ── Code ── */
    code { font-family: var(--mono); font-size: 0.88em;
      background: var(--code-bg); padding: 0.12em 0.4em; border-radius: 5px; }
    pre { background: var(--code-bg); border: 1px solid var(--line);
      padding: 16px 18px; border-radius: 12px; overflow-x: auto; line-height: 1.6; }
    pre code { background: none; padding: 0; font-size: 0.84em; }

    /* ── Tables ── */
    .table-scroll, article table { display: block; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin: 1.4em 0; font-size: 0.95em; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 14px; text-align: left; vertical-align: top; }
    thead th { background: transparent; border-bottom: 2px solid var(--ink);
      font-weight: 700; white-space: nowrap; }
    tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }

    /* ── Blockquote ── */
    blockquote { margin: 1.4em 0; padding: 0.6em 1.1em;
      border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent-soft) 50%, transparent);
      border-radius: 0 10px 10px 0; color: var(--ink); }
    blockquote p { margin: 0.35em 0; }

    hr { border: none; border-top: 1px solid var(--line); margin: 2.4em 0; }
    img { max-width: 100%; border-radius: 10px; }
    ul, ol { padding-left: 1.3em; }
    li { margin: 0.3em 0; }

    .mermaid { text-align: center; margin: 1.8em 0; }

    /* ── Footer ── */
    .site-foot { border-top: 1px solid var(--line); }
    .site-foot .wrap { padding-top: 28px; padding-bottom: 44px;
      color: var(--faint); font-size: 13px; font-family: var(--mono); }
    .site-foot a { color: var(--muted); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 520px) { body { font-size: 16px; } h1 { font-size: 1.7rem; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>한목의 개발 블로그</a>
      <span class="spacer"></span>
      <a class="nav" href="https://github.com/shm3041" rel="me">github</a>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-foot">
    <div class="wrap">
      한목 · {{ site.time | date: '%Y' }} · <a href="https://github.com/shm3041/shm3041.github.io">source</a>
    </div>
  </footer>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('pre > code.language-mermaid').forEach(function (el) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.closest('pre').replaceWith(div);
    });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: dark ? 'dark' : 'neutral',
      fontFamily: '"Pretendard Variable", Pretendard, sans-serif'
    });
    try { await mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
  </script>
</body>
</html>
