<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% seo %}
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
      --accent: #0969da; --border: #d0d7de; --code-bg: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
        --accent: #58a6ff; --border: #30363d; --code-bg: #161b22;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.75; font-size: 17px;
      word-break: keep-all; overflow-wrap: break-word;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 80px; }
    header.site {
      border-bottom: 1px solid var(--border); margin-bottom: 32px;
    }
    header.site .wrap { padding-top: 20px; padding-bottom: 20px; }
    header.site a.brand { font-weight: 700; font-size: 20px; color: var(--fg); text-decoration: none; }
    header.site p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    a { color: var(--accent); }
    h1, h2, h3 { line-height: 1.35; margin-top: 1.8em; }
    h1 { font-size: 1.9em; }
    h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    code { background: var(--code-bg); padding: .15em .4em; border-radius: 6px; font-size: .9em; }
    pre { background: var(--code-bg); padding: 16px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    th { background: var(--code-bg); }
    blockquote { border-left: 4px solid var(--border); margin: 1em 0; padding: .4em 1em; color: var(--muted); }
    .mermaid { text-align: center; margin: 1.5em 0; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { padding: 18px 0; border-bottom: 1px solid var(--border); }
    .post-list a { font-size: 1.15em; font-weight: 600; text-decoration: none; }
    .post-list time { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
    .post-meta { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    footer.site { border-top: 1px solid var(--border); margin-top: 40px; }
    footer.site .wrap { padding-top: 20px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p>{{ site.description }}</p>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site">
    <div class="wrap">
      &copy; {{ site.time | date: '%Y' }} shm3041 · GitHub Pages로 운영됩니다.
    </div>
  </footer>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('pre > code.language-mermaid').forEach(function (el) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.closest('pre').replaceWith(div);
    });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });
    await mermaid.run({ querySelector: '.mermaid' });
  </script>
</body>
</html>
