title: 한목의 개발 블로그
description: 개발하면서 배운 것들을 기록합니다
author: 한목
lang: ko-KR
timezone: Asia/Seoul

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# GitHub Pages가 빌드 시 무시할 파일
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
